name: Build Traffic Police Release APK

on:
  push:
    paths:
      - 'TrafficPolice_RuStore_READY.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Unpack project
        run: |
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q TrafficPolice_RuStore_READY.zip -d buildsrc
          find buildsrc/TrafficPoliceRuStore -maxdepth 3 -type f | sort

      - name: Configure release version
        working-directory: buildsrc/TrafficPoliceRuStore
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          code = os.environ["VERSION_CODE"]
          name = f"1.0.{code}"
          files = list(Path(".").rglob("build.gradle")) + list(Path(".").rglob("build.gradle.kts"))
          changed = 0
          for p in files:
              s = p.read_text()
              ns = re.sub(r'(?m)(\\bversionCode\\s+)(\\d+)', r'\\g<1>' + code, s)
              ns = re.sub(r'(?m)(\\bversionName\\s+)["\\\'][^"\\\']+["\\\']', r'\\g<1>"' + name + '"', ns)
              if ns != s:
                  p.write_text(ns)
                  changed += 1
                  print("Updated", p)
          print("Gradle files changed:", changed)
          PY

      - name: Generate temporary release signing key
        run: |
          STORE_PASSWORD="$(openssl rand -hex 24)"
          KEY_PASSWORD="$STORE_PASSWORD"
          keytool -genkeypair -v \
            -keystore trafficpolice-release.jks \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias trafficpolice \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Traffic Police, OU=App, O=Traffic Police, L=London, ST=England, C=GB"
          {
            echo "storeFile=$GITHUB_WORKSPACE/trafficpolice-release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=trafficpolice"
            echo "keyPassword=$KEY_PASSWORD"
          } > buildsrc/TrafficPoliceRuStore/signing.env
          chmod 600 trafficpolice-release.jks buildsrc/TrafficPoliceRuStore/signing.env

      - name: Create Gradle release signing init script
        run: |
          cat > release-signing.init.gradle <<'EOF'
          import java.util.Properties

          def props = new Properties()
          file(System.getenv("GITHUB_WORKSPACE") + "/buildsrc/TrafficPoliceRuStore/signing.env").withInputStream {
              props.load(it)
          }

          allprojects {
              afterEvaluate { project ->
                  if (project.plugins.hasPlugin("com.android.application")) {
                      def android = project.extensions.findByName("android")
                      def signingConfigs = android.signingConfigs
                      def cfg = signingConfigs.findByName("ciRelease") ?: signingConfigs.create("ciRelease")
                      cfg.storeFile = project.file(props.getProperty("storeFile"))
                      cfg.storePassword = props.getProperty("storePassword")
                      cfg.keyAlias = props.getProperty("keyAlias")
                      cfg.keyPassword = props.getProperty("keyPassword")
                      android.buildTypes.getByName("release").signingConfig = cfg
                  }
              }
          }
          EOF

      - name: Build release APK
        working-directory: buildsrc/TrafficPoliceRuStore
        run: |
          gradle --no-daemon -I "$GITHUB_WORKSPACE/release-signing.init.gradle" assembleRelease --stacktrace

      - name: Verify release APK and signature
        run: |
          APK="$(find buildsrc/TrafficPoliceRuStore -type f -path '*/outputs/apk/release/*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "Release APK was not produced."
            exit 1
          fi
          echo "Release APK: $APK"
          apksigner verify --verbose "$APK"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: TrafficPolice-Release-APK
          path: buildsrc/TrafficPoliceRuStore/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
