name: Build Traffic Police Release APK

on:
  push:
    paths:
      - 'TrafficPolice_RuStore_READY.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Unpack project
        run: |
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q TrafficPolice_RuStore_READY.zip -d buildsrc
          test -d buildsrc/TrafficPoliceRuStore/app
          test -f buildsrc/TrafficPoliceRuStore/app/src/main/assets/index.html
          find buildsrc/TrafficPoliceRuStore -maxdepth 3 -type f | sort

      - name: Configure release version
        working-directory: buildsrc/TrafficPoliceRuStore
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          code = os.environ["VERSION_CODE"]
          name = f"1.0.{code}"
          files = list(Path(".").rglob("build.gradle")) + list(Path(".").rglob("build.gradle.kts"))
          changed = 0
          for p in files:
              s = p.read_text()
              ns = re.sub(r'(?m)(\bversionCode\s+)(\d+)', r'\g<1>' + code, s)
              ns = re.sub(r'(?m)(\bversionName\s+)[\"\'][^\"\']+[\"\']', r'\g<1>"' + name + '"', ns)
              if ns != s:
                  p.write_text(ns)
                  changed += 1
                  print("Updated", p)
          print("Gradle files changed:", changed)
          PY

      - name: Prepare release signing
        env:
          KEYSTORE_B64: ${{ secrets.TRAFFICPOLICE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.TRAFFICPOLICE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TRAFFICPOLICE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TRAFFICPOLICE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > trafficpolice-release.jks
            echo "Using persistent release signing key."
          else
            echo "WARNING: persistent signing secrets are not configured."
            echo "Using a temporary key for this build only."
            STORE_PASSWORD="$(openssl rand -hex 24)"
            KEY_PASSWORD="$STORE_PASSWORD"
            KEY_ALIAS="trafficpolice"
            keytool -genkeypair -v               -keystore trafficpolice-release.jks               -storepass "$STORE_PASSWORD"               -keypass "$KEY_PASSWORD"               -alias "$KEY_ALIAS"               -keyalg RSA -keysize 2048 -validity 10000               -dname "CN=Traffic Police, OU=App, O=Traffic Police, C=RU"
          fi
          {
            echo "storeFile=$GITHUB_WORKSPACE/trafficpolice-release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > buildsrc/TrafficPoliceRuStore/signing.env
          chmod 600 trafficpolice-release.jks buildsrc/TrafficPoliceRuStore/signing.env

      - name: Create Gradle release signing init script
        run: |
          cat > release-signing.init.gradle <<'EOF'
          import java.util.Properties
          def props = new Properties()
          file(System.getenv("GITHUB_WORKSPACE") + "/buildsrc/TrafficPoliceRuStore/signing.env").withInputStream { props.load(it) }
          allprojects {
            afterEvaluate { project ->
              if (project.plugins.hasPlugin("com.android.application")) {
                def android = project.extensions.findByName("android")
                def cfg = android.signingConfigs.findByName("ciRelease") ?: android.signingConfigs.create("ciRelease")
                cfg.storeFile = project.file(props.getProperty("storeFile"))
                cfg.storePassword = props.getProperty("storePassword")
                cfg.keyAlias = props.getProperty("keyAlias")
                cfg.keyPassword = props.getProperty("keyPassword")
                android.buildTypes.getByName("release").signingConfig = cfg
              }
            }
          }
          EOF

      - name: Build release APK
        working-directory: buildsrc/TrafficPoliceRuStore
        run: |
          gradle --no-daemon -I "$GITHUB_WORKSPACE/release-signing.init.gradle" assembleRelease --stacktrace

      - name: Verify APK integrity, contents and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find buildsrc/TrafficPoliceRuStore -type f -path '*/outputs/apk/release/*.apk' | head -n 1)"
          test -n "$APK"
          test -s "$APK"
          SIZE="$(stat -c '%s' "$APK")"
          echo "Built APK: $APK ($SIZE bytes)"
          test "$SIZE" -gt 12000
          unzip -t "$APK"
          unzip -l "$APK" | grep -q 'assets/index.html'
          unzip -l "$APK" | grep -q 'classes.dex'
          unzip -l "$APK" | grep -q 'AndroidManifest.xml'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          mkdir -p dist
          cp "$APK" dist/TrafficPolice_RuStore.apk
          sha256sum dist/TrafficPolice_RuStore.apk | tee dist/SHA256SUMS.txt
          echo "APK validation passed."

      - name: Upload validated RuStore APK
        uses: actions/upload-artifact@v4
        with:
          name: TrafficPolice-RuStore-APK
          path: dist/*
          if-no-files-found: error
          compression-level: 0
